name: Reusable Build and Deploy

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
        description: "Application name (e.g. bot, server, workers)"
      dockerfile:
        required: true
        type: string
        description: "Path to Dockerfile (e.g. apps/bot/Dockerfile)"
      build_args:
        required: false
        type: string
        description: "Multiline string of Docker build arguments"
      registry_url:
        required: false
        type: string
        default: "docker.io"
        description: "Container registry host (e.g. ghcr.io, docker-hub.domain.com)"
      image_prefix:
        required: false
        type: string
        default: "app"
        description: "Image name prefix"
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
      DEPLOY_WEBHOOK:
        required: true

jobs:
  build-and-deploy:
    name: Build & Deploy ${{ inputs.app_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry_url }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: ${{ inputs.build_args }}
          tags: |
            ${{ inputs.registry_url != 'docker.io' && format('{0}/', inputs.registry_url) || '' }}${{ inputs.image_prefix }}-${{ inputs.app_name }}:${{ github.sha }}
            ${{ inputs.registry_url != 'docker.io' && format('{0}/', inputs.registry_url) || '' }}${{ inputs.image_prefix }}-${{ inputs.app_name }}:latest
          cache-from: type=gha,scope=${{ inputs.app_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app_name }}

      - name: Trigger deployment webhook (Dokploy / Coolify / Portainer)
        run: |
          curl --fail-with-body --request POST "${{ secrets.DEPLOY_WEBHOOK }}"
