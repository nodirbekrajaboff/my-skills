name: Reusable Quality Checks

on:
  workflow_call:
    inputs:
      bun_version:
        required: false
        type: string
        default: "1.2.0"

jobs:
  quality:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_db
      JWT_SECRET: test-jwt-secret-key-at-least-32-chars

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Restore Bun and Turborepo caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: quality-${{ runner.os }}-${{ hashFiles('bun.lock', '**/turbo.json') }}
          restore-keys: |
            quality-${{ runner.os }}-${{ hashFiles('bun.lock', '**/turbo.json') }}-
            quality-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
