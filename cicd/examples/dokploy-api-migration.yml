name: Dokploy Database Migration

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: dokploy-migration-prod
  cancel-in-progress: false

jobs:
  build:
    name: Build Migrator Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/migrator/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.REGISTRY_URL }}/app-migrator:${{ github.sha }}
            ${{ secrets.REGISTRY_URL }}/app-migrator:latest
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

  migrate:
    name: Execute & Verify Migrations
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
      COMPOSE_ID: ${{ secrets.DOKPLOY_MIGRATOR_COMPOSE_ID }}
    steps:
      - name: Trigger Dokploy redeploy
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-api-key: ${DOKPLOY_API_TOKEN}" \
            --data "{\"composeId\":\"${COMPOSE_ID}\",\"title\":\"DB Migration ${GITHUB_SHA}\"}" \
            "${DOKPLOY_URL%/}/api/compose.redeploy"

      - name: Poll Dokploy migration status
        run: |
          sleep 5
          for attempt in $(seq 1 36); do
            response=$(curl --fail-with-body --silent --show-error \
              --header "x-api-key: ${DOKPLOY_API_TOKEN}" \
              "${DOKPLOY_URL%/}/api/compose.one?composeId=${COMPOSE_ID}")
            
            status=$(jq --raw-output '.composeStatus // empty' <<<"$response")
            echo "Dokploy status: ${status:-unknown} (${attempt}/36)"

            case "$status" in
              done)
                echo "✅ Database migrations completed successfully."
                exit 0
                ;;
              error)
                echo "❌ Database migrations failed on Dokploy server!"
                exit 1
                ;;
              idle|running|"")
                sleep 5
                ;;
              *)
                echo "⚠️ Unexpected compose status: $status"
                exit 1
                ;;
            esac
          done

          echo "⏱️ Timed out waiting for database migration."
          exit 1
